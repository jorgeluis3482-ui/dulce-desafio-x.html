<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dulce Desafío</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Lilita One',system-ui,sans-serif;color:#fff;background:linear-gradient(#7ec8f2,#f6d9a0);display:flex;flex-direction:column;align-items:center;padding:12px}
h1{margin:4px 0 0;font-size:clamp(34px,9vw,54px);color:#ffd23f;-webkit-text-stroke:2px #7a1f1f;text-shadow:0 4px 0 #7a1f1f;letter-spacing:1px}
.sub{background:#2b4fa8;border-radius:20px;padding:3px 16px;font-size:14px;margin-bottom:10px}
.hud{display:flex;gap:8px;width:min(94vw,460px);margin-bottom:8px}
.box{flex:1;background:#1d3a7a;border:3px solid #3b66c4;border-radius:14px;text-align:center;padding:4px;font-size:13px}
.box b{display:block;font-size:22px;font-weight:400}
.goals{display:flex;justify-content:space-around;align-items:center;height:100%}
.g{display:flex;align-items:center;gap:3px;font-size:16px}.g img{width:26px;height:26px;border-radius:6px}
.g.ok{opacity:.45}
#board{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;width:min(94vw,460px);aspect-ratio:1;background:#14295c;border:4px solid #3b66c4;border-radius:16px;padding:6px;touch-action:none;user-select:none}
.c{border-radius:10px;background:#e9efff;display:flex;transition:transform .15s,opacity .2s}
.c img{width:100%;height:100%;object-fit:cover;border-radius:10px;pointer-events:none}
.c.sel{outline:3px solid #ffd23f;transform:scale(1.08)}
.c.pop{transform:scale(1.3) rotate(20deg);opacity:0}
.c.drop{animation:d .25s}
@keyframes d{from{transform:translateY(-60%);opacity:.3}}
#ov{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:5}
#ov div{background:#fff7e0;color:#7a1f1f;border-radius:22px;padding:24px 30px;text-align:center;max-width:86vw}
#ov h2{margin:0 0 6px;font-size:34px;font-weight:400}
button{font:inherit;font-size:20px;background:#2b4fa8;color:#fff;border:0;border-radius:14px;padding:8px 22px;margin-top:10px;cursor:pointer}
.foot{margin-top:10px;font-size:15px;color:#1d3a7a}
.tools{display:flex;gap:10px;margin:10px 0}.tool{position:relative;width:56px;height:56px;border-radius:50%;padding:0;font-size:28px;background:#2b4fa8;border:3px solid #7fb4ff;margin:0}.tool.on{background:#ffd23f;transform:scale(1.1)}.tool i{position:absolute;right:-4px;bottom:-4px;background:#fff;color:#1d3a7a;border-radius:50%;width:22px;height:22px;font:16px/22px 'Lilita One',sans-serif;font-style:normal}.tool:disabled{opacity:.4}
.panel{width:min(94vw,460px);background:#fff7e0;color:#1d3a7a;border-radius:16px;padding:10px 12px;margin-top:10px;font-size:15px}.panel h3{margin:0 0 6px;font-weight:400;font-size:20px}
.map{display:flex;flex-wrap:wrap;gap:6px}.n{width:44px;height:44px;border-radius:50%;background:#2b4fa8;color:#fff;border:0;padding:0;margin:0;font-size:16px;line-height:1.1}.n small{display:block;font-size:10px;color:#ffd23f}.n:disabled{background:#aab;opacity:.6}.n.cur{outline:3px solid #ffd23f}
.days{display:flex;gap:6px}.d{width:26px;height:26px;border-radius:50%;background:#dde;text-align:center;line-height:26px;font-size:13px}.d.on{background:#2fa84f;color:#fff}
.panel button.sm{font-size:15px;padding:5px 14px;margin:6px 6px 0 0}
@keyframes bounce{0%{transform:scale(.5)}70%{transform:scale(1.08)}100%{transform:scale(1)}}#ov div{animation:bounce .4s}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style></head><body>
<h1>Dulce Desafío</h1><div class="sub">Los clásicos argentinos, ahora en un match-3</div>
<div class="hud">
<div class="box">Nivel<b id="lv">1</b></div>
<div class="box" style="flex:2.2"><div class="goals" id="goals"></div></div>
<div class="box">Movimientos<b id="mv">25</b></div>
<div class="box">Puntaje<b id="sc">0</b></div>
</div>
<div id="board"></div>
<div class="tools"><button class="tool" id="t0" title="Martillo: rompe una golosina"></button><button class="tool" id="t1" title="Cohete: limpia fila y columna"></button><button class="tool" id="t2" title="Caramelo explosivo: explota 3x3"></button><button class="tool" id="snd" title="Sonido">🔊</button></div>
<div class="foot">Deslizá o tocá dos golosinas vecinas para juntar 3 o más. ¡Los clásicos nunca fallan!</div>
<div class="panel"><h3>Mapa de niveles</h3><div class="map" id="map"></div></div>
<div class="panel"><h3>Racha diaria <span id="st"></span></h3><div class="days" id="days"></div></div>
<div class="panel"><h3>Ranking semanal (tus mejores)</h3><div id="rk"></div><div>Tu mejor puntaje: <b id="best">0</b></div><button class="sm" id="sh">Compartir</button></div>
<div id="ov"><div><h2 id="ot"></h2><p id="om"></p><button id="ob"></button></div></div>

function tools(){['🔨','🚀','💥'].forEach((ic,i)=>{const b=$('t'+i);b.innerHTML=ic+'<i>'+bo[i]+'</i>';b.disabled=bo[i]<=0;b.classList.toggle('on',mode==i)})}
function streak(upd){let s=ST.get('streak',{d:'',n:0});const t=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString();
 if(upd&&s.d!=t){s={d:t,n:s.d==y?s.n+1:1};ST.set('streak',s)}
 const n=(s.d==t||s.d==y)?s.n:0,k=n?((n-1)%7)+1:0;
 $('st').textContent=n?'¡'+n+(n==1?' día!':' días!'):'';
 $('days').innerHTML=[1,2,3,4,5,6,7].map(i=>'<div class="d'+(i<=k?' on':'')+'">'+i+'</div>').join('')}
function side(){const stars=ST.get('stars',{}),w=Math.floor(Date.now()/6048e5);
 const top=Math.min(MAX_LEVEL,Math.max(1,...Object.keys(stars).map(x=>+x+1)));
 $('map').innerHTML=Array.from({length:MAX_LEVEL},(_,i)=>{const l=i+1,s=stars[l]||0;return '<button class="n'+(l==level?' cur':'')+'"'+(l>top?' disabled':'')+' onclick="go('+l+')">'+l+'<small>'+(s?'★'.repeat(s):'·')+'</small></button>'}).join('');
 const a=ST.get('wk',[]).filter(x=>x.w==w);
 $('rk').innerHTML=a.length?a.map((x,i)=>'<div>'+(i+1)+'. '+x.s.toLocaleString('es-AR')+' pts</div>').join(''):'<div>Todavía no jugaste esta semana.</div>';
 $('best').textContent=ST.get('best',0).toLocaleString('es-AR')}
function rank(sc){const w=Math.floor(Date.now()/6048e5);let a=ST.get('wk',[]).filter(x=>x.w==w);a.push({s:sc,w});a.sort((x,y)=>y.s-x.s);ST.set('wk',a.slice(0,5));if(sc>ST.get('best',0))ST.set('best',sc);side()}
function go(l){if(l<1||l>MAX_LEVEL)return;level=l;$('ov').style.display='none';newLevel();window.scrollTo(0,0)}
async function boost(r,c){busy=true;const m=new Set;
 if(mode==0)m.add(r*N+c);
 else if(mode==1){for(let k=0;k<N;k++){m.add(r*N+k);m.add(k*N+c)}}
 else for(let a=r-1;a<=r+1;a++)for(let b=c-1;b<=c+1;b++)if(a>=0&&b>=0&&a<N&&b<N)m.add(a*N+b);
 bo[mode]--;mode=-1;tools();beep(160,.3,'sawtooth');await cascade(m);hud();end();busy=false}
let g,sel,busy,level=1,moves,score,goals,start;
const $=i=>document.getElementById(i), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=()=>Math.floor(Math.random()*K());
function matches(){const m=new Set;
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=g[r][c];if(v<0)continue;
  if(c<N-2&&g[r][c+1]==v&&g[r][c+2]==v)[0,1,2].forEach(k=>m.add(r*N+c+k));
  if(r<N-2&&g[r+1][c]==v&&g[r+2][c]==v)[0,1,2].forEach(k=>m.add((r+k)*N+c));}
 return m}
function hasMove(){for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const[d,e]of[[0,1],[1,0]]){
 const r2=r+d,c2=c+e;if(r2>=N||c2>=N)continue;sw(r,c,r2,c2);const ok=matches().size>0;sw(r,c,r2,c2);if(ok)return true}return false}
function sw(a,b,c,d){const t=g[a][b];g[a][b]=g[c][d];g[c][d]=t}
function fresh(){do{g=Array.from({length:N},()=>Array.from({length:N},rnd))}while(matches().size||!hasMove())}
function render(drop){const b=$('board');b.innerHTML='';
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){const e=document.createElement('div');e.className='c'+(sel&&sel[0]==r&&sel[1]==c?' sel':'')+(drop&&drop.has(r*N+c)?' drop':'');
  e.dataset.r=r;e.dataset.c=c;if(g[r][c]>=0)e.innerHTML='<img alt="" src="'+S[T[g[r][c]]]+'">';b.appendChild(e)}}
function hud(){$('lv').textContent=level;$('mv').textContent=moves;$('sc').textContent=score.toLocaleString('es-AR');
 $('goals').innerHTML=Object.keys(goals).map(k=>'<div class="g'+(goals[k]<=0?' ok':'')+'"><img src="'+S[T[k]]+'" alt="">×'+Math.max(0,goals[k])+'</div>').join('')}
function levelTargets(){
 // Cada nivel cambia las golosinas que hay que juntar; los niveles avanzados piden más variedad.
 const count=level<6?3:level<16?3:4;
 const available=K();const start=(level*2+Math.floor(level/3))%available;
 const ids=[];for(let i=0;ids.length<count;i++){const id=(start+i)%available;if(!ids.includes(id))ids.push(id)}
 const base=10+Math.ceil(level*1.35);const out={};ids.forEach((id,i)=>out[id]=base+(i===0?4:0)+(level>=16?2:0));return out;
}
function newLevel(){goals=levelTargets();moves=25;score=0;sel=null;busy=false;bo=[3,3,3];mode=-1;fresh();render();hud();tools();side();streak(0)}
function showBonus(msg){let n=$('bonus');if(!n){n=document.createElement('div');n.id='bonus';n.style.cssText='position:fixed;z-index:20;top:18%;left:50%;transform:translateX(-50%);background:#ffcf4a;color:#54234c;font-weight:900;padding:12px 18px;border-radius:16px;box-shadow:0 5px 20px #0004;text-align:center';document.body.appendChild(n)}n.textContent=msg;n.style.display='block';clearTimeout(window.__bonusTimer);window.__bonusTimer=setTimeout(()=>n.style.display='none',1500)}
async function cascade(first){let combo=0;let bonusGiven=false;
 for(;;){const m=first||matches();first=null;if(!m.size)break;combo++;beep(440+combo*110,.15,'triangle');
  m.forEach(i=>{const v=g[Math.floor(i/N)][i%N];if(goals[v]!==undefined)goals[v]--});
  score+=m.size*10*combo;
  if(combo===4){moves+=2;beep(880,.22,'triangle');$('mv').textContent=moves;showBonus('¡Racha dulce! +2 movimientos');}
  else if(combo===6){moves+=3;beep(1040,.25,'triangle');$('mv').textContent=moves;showBonus('¡Explosión gigante! +3 movimientos');}
  document.querySelectorAll('.c').forEach(e=>{if(m.has(e.dataset.r*N+ +e.dataset.c))e.classList.add('pop')});
  hud();await sleep(220);
  m.forEach(i=>g[Math.floor(i/N)][i%N]=-1);
  const dr=new Set;
  for(let c=0;c<N;c++){let w=N-1;for(let r=N-1;r>=0;r--)if(g[r][c]>=0){if(w!=r){g[w][c]=g[r][c];g[r][c]=-1}w--}
   for(let r=w;r>=0;r--){g[r][c]=rnd()}for(let r=0;r<=w;r++)dr.add(r*N+c);for(let r=w+1;r<N;r++)dr.add(r*N+c)}
  render(dr);await sleep(300)}
 while(!hasMove()){fresh();render()}}
async function swap(a,b,c,d){if(busy||Math.abs(a-c)+Math.abs(b-d)!=1)return;busy=true;sel=null;
 sw(a,b,c,d);render();await sleep(150);
 if(!matches().size){sw(a,b,c,d);render();beep(120,.15,'square');$('board').classList.add('shake');setTimeout(()=>$('board').classList.remove('shake'),300);busy=false;return}
 moves--;streak(1);beep(300,.06);hud();await cascade();hud();end();busy=false}
function end(){const won=Object.values(goals).every(v=>v<=0);
 if(!won&&moves>0)return;
 const ov=$('ov');ov.style.display='flex';
 if(won){const s=moves>=8?3:moves>=3?2:1;const sr=ST.get('stars',{});sr[level]=Math.max(sr[level]||0,s);ST.set('stars',sr);rank(score);[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.25,'triangle'),i*150));$('ot').textContent=level>=MAX_LEVEL?'¡Ganaste Dulce Desafío!':'¡Nivel '+level+' superado!';
  $('om').textContent='★'.repeat(s)+'☆'.repeat(3-s)+'  Puntaje: '+score.toLocaleString('es-AR')+(level>=MAX_LEVEL?' · ¡Completaste los 30 niveles!':'');$('ob').textContent=level>=MAX_LEVEL?'Volver al nivel 1':'Siguiente nivel';$('ob').onclick=()=>{level=level>=MAX_LEVEL?1:level+1;ov.style.display='none';newLevel()}}
 else{rank(score);beep(200,.5,'sawtooth');$('ot').textContent='¡Casi!';$('om').textContent='Te quedaste sin movimientos. ¡Probá de nuevo!';$('ob').textContent='Reintentar';$('ob').onclick=()=>{ov.style.display='none';newLevel()}}}
const B=$('board');
B.addEventListener('pointerdown',e=>{const t=e.target.closest('.c');if(!t||busy)return;start={r:+t.dataset.r,c:+t.dataset.c,x:e.clientX,y:e.clientY}});
B.addEventListener('pointermove',e=>{if(!start||busy||mode>=0)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;
 if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;const s=start;start=null;
 if(Math.abs(dx)>Math.abs(dy))swap(s.r,s.c,s.r,s.c+Math.sign(dx));else swap(s.r,s.c,s.r+Math.sign(dy),s.c)});
B.addEventListener('pointerup',()=>{if(!start||busy){start=null;return}const s=start;start=null;
 if(mode>=0){boost(s.r,s.c);return}
 if(sel&&Math.abs(sel[0]-s.r)+Math.abs(sel[1]-s.c)==1){swap(sel[0],sel[1],s.r,s.c)}else{sel=(sel&&sel[0]==s.r&&sel[1]==s.c)?null:[s.r,s.c];render()}});
[0,1,2].forEach(i=>$('t'+i).onclick=()=>{if(busy||bo[i]<=0)return;mode=mode==i?-1:i;tools()});
$('snd').onclick=()=>{mute=!mute;$('snd').textContent=mute?'🔇':'🔊'};
$('sh').onclick=async()=>{const t='Mi mejor puntaje en Dulce Desafío: '+ST.get('best',0).toLocaleString('es-AR')+' pts. ¡Los clásicos nunca fallan!';try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);$('sh').textContent='¡Copiado!'}}catch(e){}};
newLevel();
